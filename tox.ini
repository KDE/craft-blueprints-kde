[tox]
minversion = 4.1.3
envlist = format,lint,sort-imports

[testenv:lint]
description = runs flake8
skip_install = true
deps =
   flake8==7.4.1
   git+https://invent.kde.org/sdk/flake8-kde-craft-blueprints.git
commands = flake8 .

[testenv:check-imports]
description = runs isort --check
skip_install = true
deps = isort==9.0.2
commands = isort --check --profile black .

[testenv:sort-imports]
description = runs isort
skip_install = true
deps = isort==9.0.2
commands = isort --profile black .

[testenv:format]
description = runs black
skip_install = true
deps = black==23.11.0
commands = black .
